<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top curved text path for organisation name -->
    <path id="topTextArc" d="M 68,250 A 182,182 0 1,1 432,250" fill="none" />
    
    <!-- Bottom curved text path for motto: ज्ञान • शील • एकता -->
    <!-- Drawn left to right along lower curve so text is upright -->
    <path id="bottomTextArc" d="M 95,290 A 180,180 0 0,0 405,290" fill="none" />

    <!-- Clip path for the central globe -->
    <clipPath id="innerGlobeClip">
      <circle cx="250" cy="250" r="148" />
    </clipPath>

    <!-- Radial gradient for depth -->
    <radialGradient id="globeGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e2c56" />
      <stop offset="70%" stop-color="#141a38" />
      <stop offset="100%" stop-color="#0a0d1e" />
    </radialGradient>

    <!-- Torch flame gradient -->
    <linearGradient id="torchGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Outer border subtle metallic accent -->
    <linearGradient id="outerRingGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#2a2e3d" />
    </linearGradient>
  </defs>

  <!-- Outer Black Circle Frame -->
  <circle cx="250" cy="250" r="242" fill="#090b10" stroke="#ff7700" stroke-width="2.5" stroke-opacity="0.4" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="#252a36" stroke-width="1.5" />

  <!-- Top Text: अखिल भारतीय विद्यार्थी परिषद -->
  <text fill="#a82723" font-family="'Yatra One', 'Noto Sans Devanagari', 'Mukta', sans-serif" font-weight="900" font-size="34px" letter-spacing="2.5px">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      अखिल भारतीय विद्यार्थी परिषद
    </textPath>
  </text>

  <!-- Left and Right Decorative Blue Orbs -->
  <circle cx="92" cy="318" r="9" fill="#2d6ec4" />
  <circle cx="408" cy="318" r="9" fill="#2d6ec4" />

  <!-- Bottom Text: ज्ञान • शील • एकता -->
  <text fill="#3582e0" font-family="'Yatra One', 'Noto Sans Devanagari', 'Mukta', sans-serif" font-weight="800" font-size="30px" letter-spacing="4px">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ज्ञान • शील • एकता
    </textPath>
  </text>

  <!-- Inner Globe Ring Separator -->
  <circle cx="250" cy="250" r="150" fill="#111626" stroke="#0a0c14" stroke-width="5" />

  <!-- Inner Globe Content with Clip Path -->
  <g clip-path="url(#innerGlobeClip)">
    <!-- Globe Deep Indigo Background -->
    <circle cx="250" cy="250" r="148" fill="url(#globeGrad)" />

    <!-- Vertical Blue Latitudinal / Globe Hatching Lines -->
    <g stroke="#2652a4" stroke-width="2.5" opacity="0.85">
      <line x1="160" y1="110" x2="160" y2="390" />
      <line x1="172" y1="105" x2="172" y2="395" />
      <line x1="184" y1="103" x2="184" y2="397" />
      <line x1="196" y1="102" x2="196" y2="398" />
      <line x1="208" y1="102" x2="208" y2="398" />
      <line x1="220" y1="103" x2="220" y2="397" />
      <line x1="232" y1="104" x2="232" y2="396" />
      <line x1="244" y1="105" x2="244" y2="395" />
      <line x1="256" y1="105" x2="256" y2="395" />
      <line x1="268" y1="104" x2="268" y2="396" />
      <line x1="280" y1="103" x2="280" y2="397" />
      <line x1="292" y1="102" x2="292" y2="398" />
      <line x1="304" y1="102" x2="304" y2="398" />
      <line x1="316" y1="103" x2="316" y2="397" />
      <line x1="328" y1="105" x2="328" y2="395" />
      <line x1="340" y1="110" x2="340" y2="390" />
    </g>

    <!-- Southern Half Dark Shading representing southern globe -->
    <path d="M 102,260 Q 250,330 398,260 L 398,400 L 102,400 Z" fill="#0d1222" opacity="0.7" />

    <!-- Burning Flaming Torch / India Map Silhouette (Mashaal) -->
    <!-- Saffron Flame Crown -->
    <path d="M 195,248 
             C 170,225 155,195 170,165 
             C 180,145 200,135 220,130 
             C 240,120 260,115 285,118 
             C 310,122 335,135 345,155 
             C 355,175 350,200 335,225 
             C 315,255 295,270 265,280 
             L 245,268 
             C 225,262 205,258 195,248 Z" 
          fill="url(#torchGrad)" 
          stroke="#090b10" 
          stroke-width="3" />

    <!-- Internal Flame Texture & Ridges (representing flame ripples & map relief) -->
    <g stroke="#99231f" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 190,175 Q 240,150 280,145" />
      <path d="M 185,195 Q 235,170 305,160" />
      <path d="M 180,215 Q 240,190 325,185" />
      <path d="M 195,232 Q 255,215 315,210" />
      <path d="M 220,248 Q 265,235 300,230" />
    </g>

    <!-- Torch Base / Funnel Cone -->
    <path d="M 215,252 L 255,268 L 240,305 L 210,290 Z" fill="#111624" stroke="#000" stroke-width="2" />
    
    <!-- Torch Handle (Pinkish-Red / Crimson bar) -->
    <polygon points="225,285 242,295 215,365 200,355" fill="#d92462" stroke="#090b10" stroke-width="2.5" />

    <!-- Raised Hand / Fist holding the Torch Handle -->
    <!-- Palm / Fingers Clenched -->
    <path d="M 225,290 
             C 240,295 248,310 245,325 
             C 242,340 230,355 218,365 
             C 205,372 195,355 195,340 
             C 195,325 210,305 225,290 Z" 
          fill="#0c101d" 
          stroke="#05070c" 
          stroke-width="2" />

    <!-- White Knuckles / Finger highlights -->
    <circle cx="230" cy="304" r="3.5" fill="#ffffff" />
    <circle cx="235" cy="316" r="3.5" fill="#ffffff" />
    <circle cx="233" cy="328" r="3.5" fill="#ffffff" />
    <circle cx="227" cy="340" r="3.5" fill="#ffffff" />
    <circle cx="220" cy="351" r="3.5" fill="#ffffff" />

    <!-- Additional forearm / wrist segment leading from bottom -->
    <path d="M 218,365 C 225,385 235,405 240,420 L 195,420 C 190,400 185,380 195,360 Z" fill="#090b14" />
  </g>

  <!-- Inner Border Ring (Crisp Black / Metallic) -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="#090b10" stroke-width="4" />
</svg>
